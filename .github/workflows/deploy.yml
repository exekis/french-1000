name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# the deploy job needs to mint an id token for Pages, the build job only reads the repo
permissions:
  contents: read
  pages: write
  id-token: write

# a queued deploy waits rather than cancelling one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      # the audio and artwork manifests are gates on the published dataset, so a broken
      # one should stop the deploy rather than ship a site with missing media
      - run: npm run validate:data
      - run: npm run validate:data:es
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
